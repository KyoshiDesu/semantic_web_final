# Source: UKARA 1.0 Challenge Track 1 (UGM NLP group & PUSPENDIK Kemendikbud), Task B.
# question.md = the stimulus and question from the dataset's coding-guideline file.
# reference_answer.md and the criterion are drafted by Claude (AI) from the coding guideline (Label 1);
# the dataset itself has no reference answer. Labels are binary: 1 -> 100, 0 -> 0 (_total).
# Drafted by Claude (AI) as a starting point; NOT validated by a lecturer. Review before research use.
# Aliases rebuilt 2026-11-03 from the labelled PILOT answers only (phrases in accepted vs rejected answers):
# reasons tied to the stimulus (working conditions, wages, ethical production, concern for the workers) are kept;
# generic charity reasons (pahala, amal, helping the needy, fast fashion) are dropped because the lecturers
# rejected them about as often as they accepted them. No bare generic words (kondisi, keadaan, layak, sadar,
# produksi): an alias inside a longer phrase names its concept, so "kondisi keuangan" would count as a reason.
