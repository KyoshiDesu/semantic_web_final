# Initial parameters; calibration copies tuned values into frozen.yaml (read-only afterwards).
params:
  tau_h: 0.80
  tau_l: 0.60
  delta: 0.5
  lambda: 0.0      # baseline; 0.5 is reported as a variant

llm:
  provider: anthropic
  model: claude-opus-5-5
  effort: medium   # Opus 5.5 has no temperature; determinism comes from the response cache
  max_tokens: 16000

embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
reasoner: pellet   # pellet | sparql
grounding_threshold: 0.5
# sim when the student's concept is BROADER than the key's (skos:broader, e.g. "makanan" for Glukosa).
# Must lie in the partial band tau_l <= value < tau_h; 0.70 does for every calibration grid point.
broader_similarity: 0.70
seed: 42

calibration_grid:
  tau_h: [0.75, 0.80, 0.85, 0.90]
  tau_l: [0.50, 0.60, 0.70]
